name: Backend CI

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "master", "main" ]
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test
      working-directory: ./backend
      run: ./mvnw clean verify
