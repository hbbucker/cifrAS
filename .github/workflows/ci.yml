name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test-main:
    name: CifrAS Main App — Build & Tests
    runs-on: ubuntu-latest
    environment: pipeline
    defaults:
      run:
        working-directory: ./codebase

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './codebase/src/main/webui/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./codebase/src/main/webui
        run: npm ci

      - name: Run Frontend Linter
        working-directory: ./codebase/src/main/webui
        run: npm run lint

      - name: Run Frontend Unit Tests
        working-directory: ./codebase/src/main/webui
        run: npm run test

      - name: Build and Test Backend (includes Quinoa Frontend Build)
        run: ./mvnw clean verify

      - name: Start Backend in Background (for E2E)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          SUPABASE_JWKS_URL: ${{ secrets.SUPABASE_JWKS_URL }}
          SUPABASE_JWT_ISSUER: ${{ secrets.SUPABASE_JWT_ISSUER }}
          DB_USER: ""
          DB_PASSWORD: ""
          DB_URL: ""
        run: |
          ./mvnw compile quarkus:dev -Dquarkus.http.port=8080 -Dquarkus.profile=e2e &
          # Wait until backend is fully ready
          timeout 300s bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' localhost:8080/q/health/ready)" != "200" ]]; do sleep 5; done' || false

      - name: Install Playwright Browsers
        working-directory: ./codebase/src/main/webui
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        working-directory: ./codebase/src/main/webui
        env:
          E2E_USER: ${{ secrets.E2E_USER }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npm run e2e

  build-and-test-admin:
    name: CifrAS Admin App — Build & Tests
    runs-on: ubuntu-latest
    environment: pipeline
    defaults:
      run:
        working-directory: ./codebase-admin

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './codebase-admin/src/main/webui/package-lock.json'

      - name: Install Admin Frontend Dependencies
        working-directory: ./codebase-admin/src/main/webui
        run: npm ci

      - name: Run Admin Frontend Linter
        working-directory: ./codebase-admin/src/main/webui
        run: npm run lint

      - name: Run Admin Frontend Unit Tests
        working-directory: ./codebase-admin/src/main/webui
        run: npm run test

      - name: Build and Test Admin Backend (includes Quinoa Frontend Build)
        run: ./mvnw clean verify
