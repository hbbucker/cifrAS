# =============================================================
# CifrAS Backend — Application Configuration
# =============================================================
# --- Application ---
quarkus.application.name=cifras-backend
# --- HTTP ---
quarkus.http.port=8080
# --- Datasource (PostgreSQL via Supabase) ---
# In production, set these via environment variables; Dev Services override in dev/test
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.jdbc.max-size=16
# --- Hibernate ORM ---
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
# Required when using @JdbcTypeCode(SqlTypes.JSON) — prevents conflict with REST ObjectMapper
quarkus.hibernate-orm.mapping.format.global=ignore
# --- Hibernate ORM (Dev/Test) ---
# %dev.quarkus.hibernate-orm.database.generation=drop-and-create
# %test.quarkus.hibernate-orm.database.generation=drop-and-create
# %dev.quarkus.hibernate-orm.log.sql=true

# Force Testcontainers / prevent production DB override during tests
%test.quarkus.datasource.jdbc.url=
%test.quarkus.datasource.username=
%test.quarkus.datasource.password=
# --- Quarkus Dev Services (auto PostgreSQL via Testcontainers) ---
# %dev.quarkus.datasource.devservices.enabled=true
# %dev.quarkus.datasource.devservices.image-name=postgres:16-alpine
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16-alpine
# --- MicroProfile JWT (Supabase JWKS) ---
mp.jwt.verify.publickey.location=${SUPABASE_JWKS_URL}
mp.jwt.verify.issuer=${SUPABASE_JWT_ISSUER}
mp.jwt.verify.audiences=authenticated
smallrye.jwt.path.groups=role
smallrye.jwt.verify.aud=false
smallrye.jwt.verify.algorithm=ES256
quarkus.smallrye-jwt.enabled=true
# --- Supabase Auth REST Client ---
quarkus.rest-client.supabase-auth.url=${SUPABASE_URL}
quarkus.rest-client.supabase-auth.scope=jakarta.inject.Singleton
supabase.apikey=${SUPABASE_API_KEY}

%test.quarkus.rest-client.supabase-auth.url=http://localhost:8000
%test.supabase.apikey=dummy-test-key
# --- Test JWT (override for tests using smallrye-jwt-build) ---
%test.mp.jwt.verify.publickey.location=publicKey.pem
%test.mp.jwt.verify.issuer=https://test.cifras.com
# --- Logging ---
quarkus.log.level=INFO
# %dev.quarkus.log.level=DEBUG
# --- Jackson ---
quarkus.jackson.serialization-inclusion=non-null
quarkus.jackson.fail-on-unknown-properties=false
