# =============================================================
# CifrAS Backend — Application Configuration
# =============================================================
# --- Application ---
quarkus.application.name=cifras-backend
# --- HTTP ---
quarkus.http.port=8080
quarkus.http.limits.max-body-size=10M
quarkus.rest.path=/api
# --- Datasource (PostgreSQL via Supabase) ---
# In production, set these via environment variables; Dev Services override in dev/test
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.jdbc.max-size=16
# --- Hibernate ORM ---
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
# Required when using @JdbcTypeCode(SqlTypes.JSON) — prevents conflict with REST ObjectMapper
quarkus.hibernate-orm.mapping.format.global=ignore
# --- Hibernate ORM (Dev/Test) ---
# %dev.quarkus.hibernate-orm.database.generation=drop-and-create
# %test.quarkus.hibernate-orm.database.generation=drop-and-create
# %dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.sql-load-script=import.sql

# Force Testcontainers / prevent production DB override during tests
%test.quarkus.datasource.jdbc.url=
%test.quarkus.datasource.username=
%test.quarkus.datasource.password=

# Force Dev Services / prevent production DB override during dev mode
%dev.quarkus.datasource.devservices.enabled=true
%dev.quarkus.datasource.devservices.image-name=postgres:16-alpine

# Local JWT overrides for dev mode (offline testing)

%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16-alpine
%test.smallrye.jwt.verify.algorithm=RS256
# --- MicroProfile JWT (Supabase JWKS) ---
mp.jwt.verify.publickey.location=${SUPABASE_JWKS_URL:publicKey.pem}
mp.jwt.verify.issuer=${SUPABASE_JWT_ISSUER:https://test.cifras.com}
mp.jwt.verify.audiences=authenticated
smallrye.jwt.path.groups=role
smallrye.jwt.verify.aud=false
mp.jwt.verify.publickey.algorithm=ES256
smallrye.jwt.verify.algorithms=ES256
smallrye.jwt.sign.key.location=privateKey.pem
quarkus.smallrye-jwt.enabled=true
# --- Supabase Auth REST Client ---
quarkus.rest-client.supabase-auth.url=${SUPABASE_URL:http://localhost:8000}
quarkus.rest-client.supabase-auth.scope=jakarta.inject.Singleton
supabase.apikey=${SUPABASE_API_KEY:dummy-key}

# Supabase Dev configurations removed to use .env values


%test.quarkus.rest-client.supabase-auth.url=http://localhost:8000
%test.supabase.apikey=dummy-test-key
# --- Test JWT (override for tests using smallrye-jwt-build) ---
%test.mp.jwt.verify.publickey.location=publicKey.pem
%test.mp.jwt.verify.issuer=https://test.cifras.com
# --- Logging ---
quarkus.log.level=INFO
%dev.quarkus.log.level=INFO
%dev.quarkus.log.category."io.smallrye.jwt".level=DEBUG
%dev.quarkus.log.category."io.quarkus.smallrye.jwt".level=DEBUG
%test.quarkus.log.category."br.com.cifras.shared.exception.GlobalExceptionMapper".level=FATAL
%prod.quarkus.log.console.json=true
# --- Jackson ---
quarkus.jackson.serialization-inclusion=non-null
quarkus.jackson.fail-on-unknown-properties=false

# --- Quinoa (Frontend) ---
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.dev-server.port=5173
quarkus.quinoa.package-manager-install=false


# --- Google APIs REST Clients ---
quarkus.rest-client.google-oauth.url=https://oauth2.googleapis.com
quarkus.rest-client.google-oauth.scope=jakarta.enterprise.context.ApplicationScoped
quarkus.rest-client.google-userinfo.url=https://www.googleapis.com
quarkus.rest-client.google-userinfo.scope=jakarta.enterprise.context.ApplicationScoped
quarkus.rest-client.google-drive-api.url=https://www.googleapis.com
quarkus.rest-client.google-drive-api.scope=jakarta.enterprise.context.ApplicationScoped

# Test: Google APIs mockadas (não chamam internet real)
%test.quarkus.rest-client.google-oauth.url=http://localhost:8089
%test.quarkus.rest-client.google-userinfo.url=http://localhost:8089
%test.quarkus.rest-client.google-drive-api.url=http://localhost:8089
%test.google.client.id=test-client-id

# --- Native Image ---
# Classes pulled in transitively that require JNI/native libs or JAXP APIs at runtime.
# GraalVM tries to initialize them at build time — deferring avoids native-image build failure.
# - commons-compress Zstd: via PostgreSQL JDBC driver
quarkus.native.additional-build-args=\
  --initialize-at-run-time=org.apache.commons.compress.compressors.zstandard.ZstdCompressorInputStream,\
  --initialize-at-run-time=org.apache.commons.compress.compressors.zstandard.ZstdCompressorOutputStream

# --- Security Hardening ---
cifras.crypto.master-key=my-super-secret-master-key-1234!

# E2E Test Profile (mock JWT for Playwright)
%e2e.mp.jwt.verify.publickey.location=publicKey.pem
%e2e.mp.jwt.verify.issuer=https://test.cifras.com
%e2e.smallrye.jwt.verify.algorithm=RS256
%e2e.quarkus.log.category."io.smallrye.jwt".level=DEBUG
%e2e.quarkus.log.category."io.quarkus.smallrye.jwt".level=DEBUG
