# =============================================================
# CifrAS Admin Backend — Application Configuration
# =============================================================
quarkus.application.name=cifras-admin
# Run admin on port 8081 locally to allow parallel execution with main app on 8080
quarkus.http.port=8081
quarkus.http.limits.max-body-size=10M
quarkus.rest.path=/api

# --- Datasource (Shared PostgreSQL via Supabase) ---
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.jdbc.max-size=10

# --- Hibernate ORM ---
quarkus.hibernate-orm.database.generation=update
%dev.quarkus.hibernate-orm.database.generation=update
%test.quarkus.hibernate-orm.database.generation=drop-and-create

quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
quarkus.hibernate-orm.mapping.format.global=ignore

%dev.quarkus.hibernate-orm.sql-load-script=import.sql
%test.quarkus.hibernate-orm.sql-load-script=import.sql

# Testcontainers / DevServices
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16-alpine
%test.smallrye.jwt.verify.algorithm=RS256

%dev.quarkus.datasource.devservices.enabled=true
%dev.quarkus.datasource.devservices.image-name=postgres:16-alpine

# --- MicroProfile JWT (Supabase Auth / Admin Role Verification) ---
mp.jwt.verify.publickey.location=${SUPABASE_JWKS_URL:publicKey.pem}
mp.jwt.verify.issuer=${SUPABASE_JWT_ISSUER:https://test.cifras.com}
mp.jwt.verify.audiences=authenticated
smallrye.jwt.path.groups=role
smallrye.jwt.verify.aud=false
mp.jwt.verify.publickey.algorithm=ES256
smallrye.jwt.verify.algorithms=ES256
smallrye.jwt.sign.key.location=privateKey.pem
quarkus.smallrye-jwt.enabled=true

# --- Supabase Auth Configuration ---
quarkus.rest-client.supabase-auth.url=${SUPABASE_URL:http://localhost:8000}
quarkus.rest-client.supabase-auth.scope=jakarta.inject.Singleton
supabase.apikey=${SUPABASE_API_KEY:dummy-key}

# --- Test JWT Overrides ---
%test.mp.jwt.verify.publickey.location=publicKey.pem
%test.mp.jwt.verify.issuer=https://test.cifras.com

# --- Logging ---
quarkus.log.level=INFO
%prod.quarkus.log.console.json=true

# --- Jackson ---
quarkus.jackson.serialization-inclusion=non-null
quarkus.jackson.fail-on-unknown-properties=false

# --- Quinoa (Frontend Admin Dashboard) ---
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.dev-server.port=5174
quarkus.quinoa.package-manager-install=false

# --- Native Image ---
quarkus.native.additional-build-args=\
  --initialize-at-run-time=org.apache.commons.compress.compressors.zstandard.ZstdCompressorInputStream,\
  --initialize-at-run-time=org.apache.commons.compress.compressors.zstandard.ZstdCompressorOutputStream

